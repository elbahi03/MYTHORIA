<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTHORIA</title>
    <!-- link de css  -->
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    <link rel="icon" href="./img/logomin.png">
</head>

<body>
    <header>
        <div class="header-contenue">
            <div class="logo-header">
                <a href="/" class="logo-a"><img src="./img/logoprincipal.png" alt="logo de web site des carts"></a>
            </div>
            <nav aria-label="Navigation principale">
                <ul class="menu">
                    <li><a href="/" class="lien-actif">Home</a></li>
                    <li><a href="/boutique.html">Boutique</a></li>
                    <li><a href="/">Votre boosters</a></li>
                    <li><a href="/">Ma collection</a></li>
                    <li><a href="/">Ma deck</a></li>
                    <li><a href="/">panier :<span id="length_panier">0</span></a></li>
                    <li><a href="/">Support</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <img src="./img/logoprincipal.png" alt="logo de web site des carts" height="300px" width="750px">
            <h1>Collect Build Battle</h1>
            <div class="btn-hero">
                <button class="btn btn-principal">Découvrir les boosters</button>
                <button class="btn btn-secondaire">Ouvrir mon grimoire</button>
            </div>
        </section>
        <section>
            <div class="title-principal">
                <img src="./img/logomin.png" alt="mini logo de web site des carts">
                <h2>Les catégories de cartes :</h2>
            </div>
            <div class="cartes-categorie">
                <div class="carte-categorie">
                    <h3>héros</h3>
                    <p>Serviteurs de la Lumière</p>
                    <div class="carte-img">
                        <img src="./img/hero.png" alt="Serviteurs de la Lumière">
                    </div>
                </div>
                <div class="carte-categorie">
                    <h3>monstres</h3>
                    <p>Serviteurs des Ténèbres</p>
                    <div class="carte-img">
                        <img src="./img/monster.png" alt="Serviteurs des Ténèbres">
                    </div>
                </div>
                <div class="carte-categorie">
                    <h3>serviteurs</h3>
                    <p>Minions</p>
                    <div class="carte-img">
                    <img src="./img/serviteurs.png" alt="Minions" height="250px">
                    </div>
                </div>
                <div class="carte-categorie">
                    <h3>sorts</h3>
                    <p>Spells</p>
                    <div class="carte-img">
                    <img src="./img/Spells.png" alt="Spells">
                    </div>
                </div>
            </div>
        </section>
        <section>
            <div class="title-principal">
                <img src="./img/logomin.png" alt="mini logo de web site des carts">
                <h2>les boosters disponibles :</h2>
            </div>
            <div class="boosters" id="boosters">
            </div>
            <button class="btn btn-principal btn-booster">Découvrir les boosters</button>
        </section>
    </main>
</body>

</html>
